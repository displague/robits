- name: tools.approve_and_rollout
  system_tool: true
  grantable: false
  required_capabilities:
    - operator
  owner_capability: operator
  description: Approve and roll out a proposed tool in one step. Resolves the proposal by tool name or proposal ID, approves it if still pending, registers the code in the runtime, and grants access to the specified role. Use this instead of calling approve_proposal and rollout_proposal separately.
  parameters:
    type: object
    properties:
      role_name:
        type: string
        description: Role to grant the tool to after rollout (e.g. SE).
      tool_name:
        type: string
        description: Name of the tool whose latest pending proposal should be approved and rolled out.
      proposal_id:
        type: string
        description: Specific proposal ID to approve and roll out. Use instead of tool_name when there are multiple proposals for the same tool.
      approved_by:
        type: string
        description: Name of the approving operator. Defaults to the calling agent.
    required:
      - role_name
  code: |
    return approve_and_rollout_proposal(
        employee_dict,
        role_name,
        tool_name=tool_name,
        proposal_id=proposal_id,
        approved_by=approved_by if approved_by is not None else get_caller_name(),
    )
- name: builtin.web_search
  grantable: true
  owner_capability: agent
  description: Search the web and return results. Uses ROBITS_SEARCH_URL if set, otherwise falls back to the DuckDuckGo Instant Answers API.
  parameters:
    type: object
    properties:
      query:
        type: string
        description: Search query string.
      num_results:
        type: integer
        description: Maximum number of results to return (default 5, max 20).
    required:
      - query
  code: |
    return builtin_web_search(employee_dict, query, num_results=num_results if num_results is not None else 5)
- name: builtin.url_fetch
  grantable: true
  owner_capability: agent
  description: Fetch the text content of a URL (plain text or markdown preferred). Returns up to max_chars characters. Use for reading documentation, articles, or any public web page.
  parameters:
    type: object
    properties:
      url:
        type: string
        description: The URL to fetch (must start with http:// or https://).
      max_chars:
        type: integer
        description: Maximum characters to return (default 16000, max 128000).
    required:
      - url
  code: |
    return builtin_url_fetch(employee_dict, url, max_chars=max_chars if max_chars is not None else 16000)
- name: builtin.file_search
  grantable: true
  owner_capability: agent
  description: Search the text content of files in an agent's private workspace and return matching snippets.
  parameters:
    type: object
    properties:
      agent_name:
        type: string
        description: Agent that owns the workspace to search.
      query:
        type: string
        description: Text to search for (case-insensitive substring match).
      path:
        type: string
        description: Relative directory path to search within (default is workspace root).
      max_results:
        type: integer
        description: Maximum number of matching files to return (default 10).
    required:
      - agent_name
      - query
  code: |
    return builtin_file_search(
        employee_dict,
        agent_name,
        query,
        path=path if path is not None else "",
        max_results=max_results if max_results is not None else 10,
    )
- name: builtin.shell_run
  grantable: true
  owner_capability: agent
  required_capabilities:
    - shell
  description: Run a shell command in the agent's private workspace directory. Requires the shell capability. Output is captured and returned as stdout, stderr, and returncode.
  parameters:
    type: object
    properties:
      agent_name:
        type: string
        description: Agent whose workspace directory the command runs in.
      command:
        type: string
        description: Shell command string to execute.
      timeout:
        type: integer
        description: Timeout in seconds (default 30, max 300).
    required:
      - agent_name
      - command
  code: |
    return builtin_shell_run(
        employee_dict,
        agent_name,
        command,
        timeout=timeout if timeout is not None else 30,
    )
