- name: memory.search
  system_tool: true
  grantable: true
  owner_capability: system
  description: Search an agent's accessible SQLite memory records. Returns outer-level FTS hits and surfaces parent digests for any inner records that also match.
  parameters:
    type: object
    properties:
      agent_name:
        type: string
        description: The agent performing memory introspection.
      query:
        type: string
        description: Full-text memory search query.
      limit:
        type: integer
        description: Maximum number of records to return.
      cascade:
        type: boolean
        description: Also search inner source records of digests and surface parent digests for matches (default true).
    required:
      - agent_name
      - query
  code: |
    return memory_search(
        employee_dict,
        agent_name,
        query,
        limit=limit if limit is not None else 10,
        cascade=cascade if cascade is not None else True,
    )
- name: memory.list_digests
  system_tool: true
  grantable: true
  owner_capability: system
  description: List an agent's current accessible memory digests.
  parameters:
    type: object
    properties:
      agent_name:
        type: string
        description: The agent performing memory introspection.
      digest_type:
        type: string
        enum:
          - episodic
          - identity
          - goal_long_term
          - goal_short_term
        description: Optional digest type filter.
      limit:
        type: integer
        description: Maximum number of digests to return.
    required:
      - agent_name
  code: |
    return memory_list_digests(
        employee_dict,
        agent_name,
        digest_type=digest_type,
        limit=limit if limit is not None else 10,
    )
- name: memory.expand_digest
  system_tool: true
  grantable: true
  owner_capability: system
  description: Expand an accessible memory digest into its source records.
  parameters:
    type: object
    properties:
      agent_name:
        type: string
        description: The agent performing memory introspection.
      digest_id:
        type: integer
        description: The digest ID to expand.
      recursive:
        type: boolean
        description: Include cascading digest sources recursively.
      max_depth:
        type: integer
        description: Maximum recursive expansion depth (capped by ROBITS_MEMORY_MAX_DEPTH).
      max_chars:
        type: integer
        description: Maximum characters to include in the returned result before truncation.
    required:
      - agent_name
      - digest_id
  code: |
    return memory_expand_digest(
        employee_dict,
        agent_name,
        digest_id,
        recursive=recursive if recursive is not None else True,
        max_depth=max_depth,
        max_chars=max_chars,
    )
