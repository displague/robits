- name: org.create_role
  system_tool: true
  grantable: false
  required_capabilities:
    - hr
  owner_capability: hr
  aliases:
    - create_role
  description: Create a new role in the organization.
  parameters:
    type: object
    properties:
      role_name:
        type: string
        description: The name of the new role.
      role_description:
        type: string
        description: The responsibilities and purpose of the new role.
      capabilities:
        type: array
        items:
          type: string
        description: Optional role capability flags such as operator, hr, kubeapi, protected, or essential.
      tool_grants:
        type: array
        items:
          type: string
        description: Optional initial tool grants such as agent.* or memory.search.
      requested_by:
        type: string
        description: The agent or human requesting the lifecycle change.
      approved_by:
        type: string
        description: The agent or human approving the lifecycle change.
    required:
      - role_name
      - role_description
  code: |
    return create_lifecycle_role(
        employee_dict,
        role_name,
        role_description,
        capabilities=capabilities,
        tool_grants=tool_grants,
        requested_by=requested_by,
        approved_by=approved_by,
    )
