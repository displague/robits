- name: tools.propose
  system_tool: true
  grantable: false
  required_capabilities:
    - engineer
  owner_capability: engineer
  description: Propose creation or update of a non-system trusted tool.
  parameters:
    type: object
    properties:
      requested_by:
        type: string
        description: Agent proposing the tool change. Defaults to the calling agent's name if omitted.
      tool_name:
        type: string
        description: Tool name being proposed.
      description:
        type: string
        description: Proposed behavior and purpose.
      action:
        type: string
        enum:
          - create
          - update
        description: Proposal action.
      parameters:
        type: object
        description: Proposed JSON Schema parameters for the model-facing function.
      required_capabilities:
        type: array
        items:
          type: string
        description: Capabilities required to call the proposed tool.
      owner_capability:
        type: string
        description: Capability that owns operational approval for this tool.
      safety_notes:
        type: string
        description: Safety or operational constraints for implementation.
      implementation_notes:
        type: string
        description: Notes for the engineer or operator implementing the proposal.
      code:
        type: string
        description: "Python implementation for the tool. Write the body as simple statements ending with a return — do NOT define nested functions or classes (lambdas and inline expressions are fine). No imports; builtins available: abs, bool, dict, enumerate, float, int, len, list, max, min, range, round, set, sorted, str, sum, tuple, zip. Available globals: get_caller_name() → calling agent's name; workspace_write/workspace_read/workspace_list/workspace_delete → agent files; org_chat_read → recent org chat; memory_search/memory_list_digests/memory_expand_digest → stored context; work_todo_add → task tracking; grant_tool_access/revoke_tool_access → permissions; propose_tool_change/list_tool_proposals/approve_tool_proposal/reject_tool_proposal/rollout_tool_proposal/approve_and_rollout_proposal → proposals; list_registered_tools → tool catalogue; create_lifecycle_role/pause_lifecycle_role/retire_lifecycle_role/archive_lifecycle_role/list_lifecycle_roles → org lifecycle; create_alarm/list_alarms/cancel_alarm → scheduling; agent_think/agent_wait → agent control; current_agent_context → runtime context; builtin_web_search/builtin_file_search/builtin_shell_run/builtin_tool_search/builtin_mcp_call/builtin_computer_use/builtin_image_generation → builtins. Good example: return f\"{get_caller_name()}: {message}\". Bad example: def f(x): return x (nested defs not allowed). The code is compiled immediately on proposal; a clean compile means rollout activates the tool without a restart."
    required:
      - tool_name
  code: |
    return propose_tool_change(
        employee_dict,
        requested_by if requested_by is not None else get_caller_name(),
        tool_name,
        description if description is not None else tool_name,
        action=action if action is not None else "create",
        parameters=parameters,
        required_capabilities=required_capabilities,
        owner_capability=owner_capability,
        safety_notes=safety_notes if safety_notes is not None else "",
        implementation_notes=implementation_notes if implementation_notes is not None else "",
        code=code if code is not None else "",
    )
