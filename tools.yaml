    Suspend this agent for up to N minutes. The session skips this agent's turns until
    the wait expires, then delivers a summary of what happened while you were waiting.
    Circadian phase transitions (shift changes, breaks, sleep) may interrupt the wait
    early and will be noted in the wake-up summary.
  parameters:
    type: object
    properties:
      minutes:
        type: number
        description: How long to wait, in minutes. Must be positive.
    required:
      - minutes
  code: |
    return agent_wait(employee_dict, minutes)
- name: agent.spawn
  grantable: true
  owner_capability: agent
  description: >
    Spawn a stateless sub-agent to perform a focused task and return its result.
    The sub-agent has no conversation history and no memory tools — it receives only
    the task description and a limited operational tool set. Use this to delegate
    web research, URL fetching, or tool discovery without burdening your own context.
    By default the sub-agent may call: agent.think, builtin.web_search,
    builtin.url_fetch, builtin.tool_search. You may extend this by listing additional
    tool names in the `tools` parameter; memory, org, lifecycle, proposal, and
    agent.spawn tools are always blocked from sub-agents.
  parameters:
    type: object
    properties:
      task:
        type: string
        description: >
          The task for the sub-agent to perform. Be specific: include what to look for,
          what to return, and any relevant context the sub-agent will need.
      tools:
        type: array
        items:
          type: string
        description: >
          Optional list of tool names to grant beyond the defaults (e.g.
          ["builtin.shell_run"] for compute tasks). Memory and org tools are
          always excluded regardless of this list.
      model:
        type: string
        description: >
          Optional model override. Defaults to the configured cheap model.
    required:
      - task
  code: |
    return agent_spawn(employee_dict, task, tools=tools if tools is not None else [], model=model if model is not None else "")
- name: memory.search
  system_tool: true
  grantable: true
  owner_capability: system
  description: >
    Search an agent's memory records. Use this whenever asked about past events,
    personal experiences, or work history — do not answer from assumed knowledge.
    Use channel_type=agent_thought for personal/private memories,
    channel_type=org_chat for work context. Returns FTS hits and parent digests.
  parameters:
    type: object
    properties:
      agent_name:
        type: string
        description: The agent performing memory introspection.
      query:
        type: string
        description: Full-text memory search query.
      limit:
        type: integer
        description: Maximum number of records to return.
      cascade:
        type: boolean
        description: Also search inner source records of digests and surface parent digests for matches (default true).
      channel_type:
        type: string
        description: "Restrict search to a specific conversation scope. Valid values: org_chat, agent_thought, agent_dm, therapist, family_member, family_group, work_peer, system. Omit to search across all channels."
    required:
      - agent_name
      - query
  code: |
    return memory_search(
        employee_dict,
        agent_name,
        query,
        limit=limit if limit is not None else 10,
        cascade=cascade if cascade is not None else True,
        channel_type=channel_type if channel_type is not None else None,
    )
- name: memory.list_digests
