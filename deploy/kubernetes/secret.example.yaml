# Not part of kustomization.yaml, so real credentials never live next to the example.
# Fill in and apply separately, or create it with:
#   kubectl -n robits create secret generic robits-secrets \
#     --from-literal=OPENAI_API_KEY=... --from-file=mcp.json=./mcp.json
apiVersion: v1
kind: Secret
metadata:
  name: robits-secrets
  labels: {app.kubernetes.io/name: robits}
type: Opaque
stringData:
  # Local servers usually accept any value.
  OPENAI_API_KEY: "not-needed"
  # MCP servers (ROBITS_MCP_CONFIG). Entries may carry auth headers, hence a Secret.
  mcp.json: |
    {}
